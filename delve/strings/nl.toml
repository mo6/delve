[ui]
# De ja/nee-toetsen voor een [jn]-prompt (het hervat-/overslaan-aanbod). Gelokaliseerd, zodat een
# Nederlandse prompt [Jn] toont en 'j' aanneemt in plaats van [Yn]; 'y'/'n' blijven overal werken.
yes_key      = "j"
no_key       = "n"
no_messages  = "Er is nog niets gebeurd."
# Paginering van een paneel; page_fmt is een sjabloon dat de UI vult met {page}/{total}.
more         = "--Meer--"
end          = "(einde)"
page_fmt     = "(pagina {page} van {total})"
who_are_you  = "Wie ben je?"
name_hint    = "(typ een naam, dan Enter)"
default_name = "Avonturier"
trophy_title = "Je prijzenkast"
press_any    = "(druk op een toets)"
resume       = "{name}, je liet {pack} onafgemaakt. Weer afdalen waar je gebleven was?"
skip         = "Je hebt de blik van iemand die dit eerder gedaan heeft. De uitleg overslaan?"
pick_pet     = "Wie gaat er met je mee naar beneden?"
# De toetsen komen uit pet_key_* hieronder, zodat de letter tussen haken altijd klopt: kat -> k, hond -> h.
pick_pet_hint = "[{cat}] een kat    [{dog}] een hond    [{none}] niemand, ik ga alleen"
