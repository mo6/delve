# Nederlandse engine-strings. Tutoyeer (je, nooit u), zinshoofdletters, geen kastlijntjes; zie
# STYLE.md. Kaartglyphs en toetsen (pijltjes, t, q, spatie, Esc, >, <, ?) zijn het alfabet van het
# spel en vertalen niet; alleen de woorden eromheen wel. De boom moet gelijk lopen met en.toml.

[msg]
no_exit       = "{keeper} kijkt niet op. Er is geen uitweg uit deze kamer."
cant_go       = "Die kant kun je niet op."
no_one        = "Er is hier niemand om mee te praten."
put_down      = "Je legt het weg."
bump_passed   = "\"Die heb je al gehad,\" zegt {first}, en gaat weer aan het werk."
examines      = "{name} overhoort je."
correct       = "Juist."
not_quite     = "Net niet."
grading       = "Je geeft je antwoord af. De poortwachter leest het en denkt na."
greet         = "{name} kijkt niet op."
fail          = "Nog niet. Lees het nog eens, en praat dan met {first}."
repelled      = "{name} schudt het hoofd. Je wordt bij de deur weggedrongen."
respawn       = "Het donker sluit zich over je. Je wordt wakker bij de ingang, weer heel. Elke deur die je verdiende staat nog open."
descend       = "Je daalt de trap af. {title}."
no_stairs_down = "Hier is geen trap naar beneden."
ascend        = "Je klimt weer omhoog. {title}."
no_stairs_up  = "Hier is geen trap naar boven."
already_whole = "Je bent al helemaal heel."
rested        = "Je rust een poos. Je kracht keert terug en je hoofd wordt helder."
scroll_taken  = "Je tilt het certificaat van de sokkel. De poortwachters blijven hier beneden; de gewoonten niet."
# De metgezel (PETS.md): {name} is de naam van het dier (standaard 'je katje', of een hond).
no_companion  = "Je hebt geen metgezel om iets te vragen."
pet_nothing   = "{name} kijkt je aan en knippert. Er is hier niets om naar te vragen."
pet_already   = "{name} heeft je al verteld wat het hiervan vindt."
pet_strike    = "{name} snuffelt aan een antwoord en haalt zijn neus op. Die vraag telt niet meer mee voor je score."
pet_free      = "{name} schuift één antwoord opzij, een gunst deze ene keer, en het kost je niets."
pet_pat       = "Je aait {name}. Verder heeft het niets voor je."
# Betaald wegstrepen van een MCQ-optie (DELVE-0018): goud is de prijs; de score blijft tellen.
buy_remove    = "Je geeft {coins} uit. Eén fout antwoord valt weg."
buy_poor      = "Je hebt niet genoeg goud. Een antwoord wegstrepen kost {coins}."
buy_nothing   = "Hier is niets te kopen."
retrieve_cat  = "Je drijft {name} in het nauw en wrikt {coins} los."
retrieve_dog  = "Je neemt {coins} terug van {name}."
retrieve_dog_item = "{name} geeft {what} af; het valt naast je neer."
# De fakkel (DELVE-0062): uitdoven met een reserve die meteen bijspringt, en uitdoven zonder
# reserve. Oprapen (in de zak vs. meteen aansteken) staat bij [item], naast pickup/pickup_none.
torch_burnout_relit = "Je fakkel dooft, maar een reserve vlamt meteen op."
torch_burnout_dark = "Je fakkel dooft. Je hebt geen eigen licht meer over."

# Objecten (OBJECTS.md): geld gaat vanzelf mee met {coins} (coin_one/coins voor 1 of meer).
[item]
collect       = "Je raapt {coins} op."
coin_one      = "een munt"
coins         = "{n} munten"
pickup        = "Je raapt {what} op."
pickup_none   = "Hier is niets om op te rapen."
# De eigen naam van de fakkel (DELVE-0062): motorgebonden, geen pakketinhoud, dus omzeilt hier
# `ItemDef.name` net zoals coin_one/coins dat voor geld doen; dit legt het Nederlandse woord vast
# als "fakkel", los van wat het ambient-promptmodel zegt.
torch_one     = "een fakkel"
torches       = "{n} fakkels"
torch_pickup_stowed = "Je hebt al een fakkel branden; je bergt deze op."
torch_pickup_lit = "Je raapt de fakkel op. Hij vlamt meteen op."
torch_lit_menu = "brandende fakkel ({n} stappen resterend)"
torch_charge_one  = "fakkel ({n} stappen resterend)"
torch_charge_many = "fakkels ({count}, {n} stappen resterend)"
torch_look    = "Een fakkel. Hij verlicht de hele kamer zolang hij brandt en dooft na een tijdje vanzelf; een reservefakkel in je rugzak ontbrandt dan meteen vanzelf."
money_look    = "Munt. Hij verdwijnt vanzelf in je buidel zodra je eroverheen loopt en telt meteen mee in je totaal."
pickup_prompt = "Wat wil je oprapen?"
pickup_amount = "Hoeveel wil je oprapen?"
here          = "Je ziet hier {what} liggen."
one           = "een {name}"
many          = "{count} {plural}"
numbers       = ["nul", "een", "twee", "drie", "vier", "vijf", "zes", "zeven", "acht", "negen", "tien", "elf", "twaalf"]
