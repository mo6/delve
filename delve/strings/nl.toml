pet_give_item = "{name} rent terug en legt {what} naast je neer."

# De standaardnamen per soort, gebruikt als de leerling het dier geen naam geeft (PETS.md).
[pet]
default_cat = "je katje"
default_dog = "je hond"
noun_cat = "kat"
noun_dog = "hond"
phrase = "{species} genaamd {name}"

# Vraagchroom in het paneel: de voortgangsteller onder de opties, en het woord tussen de twee
# labels van een bewering ('Waar of Niet waar?'). Zie [question] in en.toml.
[question]
counter = "Vraag {idx} van {total}."
or      = "of"
blank   = "(je hebt dit leeg gelaten)"

[grading]
title = "Je antwoord wordt nagekeken"
body  = "De poortwachter leest wat je schreef en vergelijkt het met wat hij verwacht."

[pass]
door     = "De muur knarst. Waar steen was, is nu een deur."
stairs   = "De verre muur opent zich naar een trap omlaag."
# Getoond als de trap naar beneden al openstond (op de introverdieping staat hij er vanaf het begin).
stairs_open = "De trap naar beneden stond hier al open. Ga naar beneden wanneer je zover bent."
pedestal = "De steen wijkt. Erachter een sokkel, en daarop een certificaat."

[keeper_kind]
wizard     = "tovenaar"
gatekeeper = "poortwachter"
shopkeeper = "winkelier"

# De stem van de poortwachter als de les begint (M8); zie [teach] in en.toml. `default` vangt elke
# niet-vermelde soort op.
[teach]
wizard     = "{name} gaat er goed voor zitten en zet de les uiteen als een bewijs."
gatekeeper = "{name} houdt het kort. Luister één keer."
shopkeeper = "{name} stalt de kennis uit als koopwaar op een toonbank."
default    = "{name} begint de les."

# Het winscherm, getoond zodra het certificaat is weggelegd en de tocht voorbij is (M8). Er is
# geen doodscherm: teruggedrongen worden is geen dood, en bij 0 HP word je wakker bij de ingang.
[win]
