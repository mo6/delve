ambient_run         = "Deze sessie: In {tin}   Out {tout}"
ambient_run_calls   = "Aanroepen {calls}"
ambient_avg         = "Gem. duur: {ms} ms"
ambient_latency     = "Duur: {spark}  (aanroepen)"
reward        = "{name} laat {coins} op de vloer achter."
amount_range  = "1 tot {max}"
pet_grab      = "{name} springt op {coins} en stopt ze weg."
pet_give      = "{name} rent terug en legt {coins} naast je neer."
